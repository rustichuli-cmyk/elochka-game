<!DOCTYPE html>
<html>
  <head>
    <title>Кролик-фермер</title>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; }
      #character { width: 200px; cursor: pointer; margin: 20px auto; }
      .stats, .shop { margin: 15px auto; max-width: 400px; border: 1px solid #ccc; padding: 10px; display: inline-block; }
      button { padding: 8px 16px; margin: 5px; cursor: pointer; }
      .disabled { opacity: 0.5; pointer-events: none; }
    </style>
  </head>
  <body>
    <h1>🐇 Кролик-фермер</h1>
    <div class="stats">
      <p>Морковок: <span id="score">0</span></p>
      <p>Доход в секунду: <span id="perSec">0</span></p>
    </div>

    <img id="character" src="https://via.placeholder.com/200?text=🐇+Кролик" alt="Кролик" />

    <div class="shop">
      <h3>Магазин улучшений</h3>
      <button onclick="buy('clickPower', 10)">+1 к силе клика (10 морковок)</button><br>
      <button onclick="buy('autoIncome', 20)">+1 авто-доход/сек (20 морковок)</button>
    </div>

    <script>
      let score = 0;
      let clickPower = 1;
      let autoIncome = 0;

      const updateUI = () => {
        document.getElementById('score').innerText = Math.floor(score);
        document.getElementById('perSec').innerText = autoIncome;
      };

      document.getElementById('character').addEventListener('click', () => {
        score += clickPower;
        updateUI();
      });

      setInterval(() => {
        if (autoIncome > 0) {
          score += autoIncome;
          updateUI();
        }
      }, 1000);

      const buy = (type, cost) => {
        if (score >= cost) {
          score -= cost;
          if (type === 'clickPower') clickPower++;
          else if (type === 'autoIncome') autoIncome++;
          updateUI();
        }
      };
    </script>
  </body>
</html>
