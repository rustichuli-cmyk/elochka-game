<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ёлочка: Зимняя Поляна</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0d1b2a linear-gradient(to bottom, #0d1b2a, #1b263b);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow: hidden; user-select: none;
        }
        /* Анимация падающего снега */
        .snowflake {
            position: absolute; top: -10px; color: #fff; font-size: 1em;
            pointer-events: none; animation: fall linear infinite; z-index: 1;
        }
        @keyframes fall {
            to { transform: translateY(105vh) translateX(20px); }
        }
        
        .game-container {
            width: 100%; max-width: 450px; z-index: 10;
            display: flex; flex-direction: column; align-items: center; padding: 15px; box-sizing: border-box;
        }
        /* Экономическая панель ВК */
        .resources-panel {
            display: flex; justify-content: space-around; width: 100%;
            background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 20px;
            backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .res-item { display: flex; align-items: center; font-weight: bold; font-size: 16px; }
        .res-icon { font-size: 20px; margin-right: 5px; }

        /* Игровая поляна */
        .playfield {
            position: relative; width: 100%; height: 320px; margin: 20px 0;
            background: #2c3e50 linear-gradient(to bottom, #34495e, #2c3e50);
            border-radius: 25px; border: 3px solid #415a77;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        /* Графика ёлочки на основе Emoji со спецэффектами */
        .tree-display {
            font-size: 140px;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            display: flex; align-items: center; justify-content: center;
        }
        .tree-display:active { transform: scale(1.15); }

        /* Кнопки улучшения */
        .upgrade-section { width: 100%; text-align: center; }
        .lvl-badge { background: #e63946; padding: 5px 15px; border-radius: 15px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .main-btn {
            background: #2a9d8f; color: white; border: none; width: 85%;
            padding: 15px; font-size: 18px; font-weight: bold; border-radius: 30px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(42, 157, 143, 0.4); transition: 0.2s;
        }
        .main-btn:hover { background: #264653; }
        
        /* Вкладки как в меню ВК */
        .nav-menu { display: flex; width: 100%; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: auto; margin-bottom: 10px; }
        .nav-item { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; color: #ccc; }
        .nav-item.active { color: #fff; background: rgba(255,255,255,0.15); border-radius: 15px; }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Верхняя панель ресурсов -->
    <div class="resources-panel">
        <div class="res-item"><span class="res-icon">🪙</span> <span id="coins-txt">0</span></div>
        <div class="res-item"><span class="res-icon">🪄</span> <span id="sticks-txt">10</span></div>
        <div class="res-item"><span class="res-icon">💎</span> <span>5</span></div>
    </div>

    <!-- Поляна с Ёлкой -->
    <div class="playfield">
        <div id="main-tree" class="tree-display" onclick="upgradeTree()">🌱</div>
    </div>

    <!-- Управление -->
    <div class="upgrade-section">
        <div class="lvl-badge">Уровень Поляны: <span id="lvl-txt">1</span></div>
        <button class="main-btn" onclick="upgradeTree()">Вулкан Магии (-2 🪄)</button>
        <p style="font-size: 12px; color: #a9d6e5; margin-top: 5px;">Монеты капают автоматически: +1/сек</p>
    </div>

    <!-- Меню -->
    <div class="nav-menu">
        <div class="nav-item active">🎄 Поляна</div>
        <div class="nav-item" onclick="alert('Рейтинг будет доступен после запуска сервера!')">🏆 Топ-100</div>
        <div class="nav-item" onclick="alert('Добавление друзей по ID будет на следующем шаге!')">👥 Друзья</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    if (tg) tg.expand();

    // Баланс игры
    let coins = 0;
    let sticks = 10;
    let level = 1;

    // Стадии роста в зависимости от уровня
    function getTreeEmoji(lvl) {
        if (lvl <= 2) return "🌱";      // Начальный росток
        if (lvl <= 4) return "🌿";      // Кустик
        if (lvl <= 6) return "🌲";      // Молодая ель
        if (lvl <= 8) return "🎄";      // Нарядная ёлочка
        return "🌟🎄🌟";                // Легендарный уровень!
    }

    // Автоматический сбор монет (пассивный доход поляны)
    setInterval(() => {
        coins += level;
        document.getElementById('coins-txt').innerText = coins;
    }, 1000);

    function upgradeTree() {
        if (sticks < 2) {
            if (tg && tg.showAlert) {
                tg.showAlert("🪄 Не хватает волшебных палочек!");
            } else {
                alert("🪄 Не хватает волшебных палочек!");
            }
            return;
        }
        sticks -= 2;
        level++;

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success'); // Вибрация на телефоне
        }
        
        // Обновляем графику и тексты
        document.getElementById('main-tree').innerText = getTreeEmoji(level);
        document.getElementById('sticks-txt').innerText = sticks;
        document.getElementById('lvl-txt').innerText = level;
    }

    // Генератор снега на экране
    function createSnow() {
        const flake = document.createElement('div');
        flake.classList.add('snowflake');
        flake.innerText = '❄';
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = Math.random() * 3 + 2 + 's';
        flake.style.opacity = Math.random();
        flake.style.fontSize = Math.random() * 10 + 10 + 'px';
        document.body.appendChild(flake);
        setTimeout(() => { flake.remove(); }, 5000);
    }
    setInterval(createSnow, 200);
</script>
</body>
</html>
